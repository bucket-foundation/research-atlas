name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_advisor_join.py tests/test_pi_resolve.py tests/test_official_directory.py tests/test_users_schema.py tests/test_users_contacts.py
